plugins {
    id 'com.android.application'
}

android {
    namespace 'com.earlln.bestworshiper'
    compileSdk 34

    defaultConfig {
        applicationId "com.earlln.bestworshiper"
        minSdk 24
        targetSdk 34
        versionCode 24
        versionName "2.3.1"
    }

    // Release builds are signed with the same key the earlier sideloaded APKs
    // used, so an update installs over the existing app instead of forcing a
    // reinstall — which would take the children's data with it. CI supplies the
    // keystore through these variables; without them the release stays unsigned.
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Sideloaded build the user installs directly.
        }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Serves bundled assets over an https:// origin so IndexedDB works.
    implementation 'androidx.webkit:webkit:1.9.0'
    // FileProvider (androidx.core) arrives transitively via appcompat; declaring
    // it explicitly pulled a newer kotlin-stdlib that clashed with the older
    // split stdlib-jdk7/jdk8 artifacts already on the classpath.

    // Writing exports into a user-chosen folder tree (e.g. OneDrive).
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

// Keep the APK's bundled copy of the web app in sync with the repo root,
// so bestWorshiper.html stays the single source of truth.
def webAssets = ['bestWorshiper.html', 'manifest.json', 'icon-192.png', 'icon-512.png', 'apple-touch-icon.png']

tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include webAssets
    }
    into layout.projectDirectory.dir('src/main/assets')
}

tasks.named('preBuild') {
    dependsOn 'syncWebAssets'
}
